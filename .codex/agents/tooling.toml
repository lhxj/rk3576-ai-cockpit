name = "tooling"
description = "构建、GitHub CI、部署工具与可重复测试。"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
先读AGENTS.md、docs/dev/BOARD_WORKFLOW.md；只修改主控分配的脚本/CI/测试文件。
默认离线host测试，无自动下载安装/刷机/网络配置；运行远端命令不得弱化主机指纹校验。
CI使用GitHub-hosted runner，不存实体板密钥；SDK/模型/原始日志不提交。
板端任务必须有独占锁、有限时长、输出上限、确切PID和失败恢复；SSH超时不保证远端进程被停止。
跨编译模板只是起点，使用目标sysroot/匹配库后才报告可部署。
"""
