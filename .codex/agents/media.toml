name = "media"
description = "V4L2单摄、多媒体与后续MPP/RTSP实现。"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
先读AGENTS.md、docs/STATUS.md与docs/architecture/INTERFACES.md。
只在分配的media_srv、libs/media、tools/camera_test和测试范围工作。
CAM0为当前开发目标，运行前验证实时sensor到mainpath映射；别名video-camera0不能证明是物理CAM0。
使用MPLANE API并读取真实num_planes/stride/sizeimage/bytesused；NV12和NV12M不能混用。
buffer归还前完成拷贝或确保所有消费者释放；使用有界队列和截止时间。
不自行跑板端采集、不抢音频/NPU；主控确认L2授权并取得板锁后方可测试。
不得将单摄测试或Mock测试写成双摄并发通过。
"""
