name: host-ci
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout (pinned v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Host scaffold build and tests
        run: bash scripts/dev/host_ci.sh
